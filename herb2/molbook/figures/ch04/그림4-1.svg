<text x="1600" y="222" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:24px;font-weight:700" fill="#111">혈중 노출이 줄어든다</text>
<text x="900" y="372" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:24px;font-weight:700" fill="#111">사람에서 잰 약물 노출의 변화</text>
