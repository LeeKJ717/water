<text x="795" y="226" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:22px;font-weight:400" fill="#111">발현 증가</text>
<path d="M924,175 L1004,150" fill="none" stroke="#222" stroke-width="4"  marker-end="url(#ah)"/>
