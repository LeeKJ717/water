<text x="800" y="128" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:21px;font-weight:700" fill="#1f3f86">간세포·장 상피세포의 핵</text>
<polygon points="137.7,216.0 110.0,232.0 82.3,216.0 82.3,184.0 110.0,168.0 137.7,184.0" fill="#f2a33c" stroke="#7a4a00" stroke-width="3"/><circle cx="110" cy="200" r="14.4" fill="none" stroke="#7a4a00" stroke-width="2.5"/>
<text x="110" y="150" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:22px;font-weight:700" fill="#111">하이퍼포린</text>
<text x="110" y="262" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:19px;font-weight:400" fill="#111">(세인트존스워트)</text>
<path d="M150,200 L260,200" fill="none" stroke="#222" stroke-width="5"  marker-end="url(#ah)"/>
<rect x="270" y="150" width="300" height="100" rx="14" fill="#e8f0fb" stroke="#1f3f86" stroke-width="3"/>
<text x="420" y="190" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:25px;font-weight:700" fill="#111">PXR (핵수용체)</text>
<text x="420" y="226" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:19px;font-weight:400" fill="#111">Ki 27 nM (Moore 외, 2000)</text>
