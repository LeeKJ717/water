<text x="1170" y="174" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:20px;font-weight:400" fill="#111">간·장에서 증가</text>
<rect x="1010" y="208" width="320" height="90" rx="14" fill="#eaf5ea" stroke="#2f6f3f" stroke-width="3"/>
<text x="1170" y="245" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:22px;font-weight:700" fill="#111">MDR1 / P-당단백질</text>
<text x="1170" y="277" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:20px;font-weight:400" fill="#111">장에서 증가</text>
<path d="M1334,200 L1424,200" fill="none" stroke="#222" stroke-width="5"  marker-end="url(#ah)"/>
<rect x="1430" y="140" width="340" height="120" rx="14" fill="#fde7e7" stroke="#7a1f1f" stroke-width="3"/>
