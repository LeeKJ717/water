<rect x="930" y="395" width="400" height="66" rx="12" fill="#ffffff" stroke="#555" stroke-width="3"/>
<text x="1130" y="437" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:20px;font-weight:700" fill="#111">IL-1β 성숙 · GSDMD 절단</text>
<path d="M1130,465 L1130,496" fill="none" stroke="#222" stroke-width="4"  marker-end="url(#ah)"/>
<rect x="930" y="500" width="400" height="66" rx="12" fill="#e8f0fb" stroke="#1f3f86" stroke-width="3"/>
<text x="1130" y="542" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:20px;font-weight:700" fill="#111">IL-6 → JAK2 → STAT3</text>
<text x="1560" y="110" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:16px;font-weight:700" fill="#111">Luo 외(2017): 바이칼레인이 NLRP3 활성과</text>
<text x="1560" y="134" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">IL-1β 발현도 줄였다 (생쥐 장염 모델)</text>
<text x="1560" y="215" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:16px;font-weight:700" fill="#111">오리도닌: NLRP3 Cys279에 공유결합, NEK7 상호작용 차단</text>
<text x="1560" y="239" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">(He 외, 2018; 허브 성분의 예)</text>
<text x="1560" y="320" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:16px;font-weight:700" fill="#111">파르테놀리드: 카스파아제-1 단백분해 활성을 직접 억제</text>
<text x="1560" y="344" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">(Juliana 외, 2010)</text>
<text x="1560" y="425" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:16px;font-weight:700" fill="#111">GSDMD 절단형이 세포사(pyroptosis)와 IL-1β 분비에 필요</text>
<text x="1560" y="449" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">(He 외, 2015)</text>
<text x="1560" y="530" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:16px;font-weight:700" fill="#111">보스웰리아 AKBA: SHP-1을 늘려 STAT3 탈인산화</text>
<text x="1560" y="554" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">(Kunnumakkara 외, 2009; 다발골수종 세포)</text>
<line x1="30" y1="735" x2="1770" y2="735" stroke="#555" stroke-width="3" stroke-dasharray="12 8"/>
