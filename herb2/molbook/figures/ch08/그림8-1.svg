<rect x="930" y="185" width="400" height="66" rx="12" fill="#fff3c9" stroke="#8a6d1d" stroke-width="3"/>
<text x="1130" y="227" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:20px;font-weight:700" fill="#111">신호 2: NLRP3 + NEK7 조립</text>
<path d="M1130,255 L1130,286" fill="none" stroke="#222" stroke-width="4"  marker-end="url(#ah)"/>
<rect x="930" y="290" width="400" height="66" rx="12" fill="#fff3c9" stroke="#8a6d1d" stroke-width="3"/>
<text x="1130" y="332" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:20px;font-weight:700" fill="#111">카스파아제-1 활성</text>
