<text x="220" y="437" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:21px;font-weight:700" fill="#111">IKKβ → IκBα 인산화·분해</text>
<path d="M220,465 L220,496" fill="none" stroke="#222" stroke-width="4"  marker-end="url(#ah)"/>
<rect x="30" y="500" width="380" height="66" rx="12" fill="#eaf5ea" stroke="#2f6f3f" stroke-width="3"/>
<text x="220" y="542" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:21px;font-weight:700" fill="#111">NF-κB(p65) 핵으로 이동</text>
<path d="M220,570 L220,601" fill="none" stroke="#222" stroke-width="4"  marker-end="url(#ah)"/>
<rect x="30" y="605" width="380" height="66" rx="12" fill="#ffffff" stroke="#555" stroke-width="3"/>
<text x="220" y="647" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:21px;font-weight:700" fill="#111">TNF · IL-6 · IL-8 · COX-2 전사</text>
<text x="650" y="110" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:18px;font-weight:700" fill="#111">감초 글리시리진: HMGB1 억제제로 쓰인다</text>
<text x="650" y="136" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:17px;font-weight:400" fill="#111">(Paudel 외, 2020)</text>
<text x="650" y="215" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:18px;font-weight:700" fill="#111">황금 바이칼레인: MD-2 주머니에 결합,</text>
<text x="650" y="241" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:17px;font-weight:400" fill="#111">LPS가 만드는 MD-2/TLR4 복합체 억제 (Luo 외, 2017)</text>
<text x="650" y="425" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:18px;font-weight:700" fill="#111">생강 D10G: IKKβ의 Cys179와 상호작용</text>
<text x="650" y="451" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:17px;font-weight:400" fill="#111">(Lee 외, 2012; 세포·효소 수준)</text>
<text x="650" y="530" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:18px;font-weight:700" fill="#111">뇌공등 트립톨라이드: DNA 결합은 그대로,</text>
<text x="650" y="556" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:17px;font-weight:400" fill="#111">전사 활성화를 억제 (Qiu 외, 1999; Zhao 외, 2000)</text>
<text x="650" y="635" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:18px;font-weight:700" fill="#111">같은 경로 위에서도 성분마다 닿는 지점이 다르다</text>
<text x="650" y="661" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:17px;font-weight:400" fill="#111">(위 네 곳은 서로 다른 보고이다)</text>
<text x="1350" y="45" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:27px;font-weight:700" fill="#111">② 인플라마좀과 STAT3</text>
