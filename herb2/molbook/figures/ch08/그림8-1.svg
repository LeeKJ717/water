<rect x="40" y="805" width="400" height="150" rx="14" fill="#ffffff" stroke="#555" stroke-width="2.5"/>
<text x="240" y="850" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:24px;font-weight:700" fill="#111">황금 바이칼린</text>
<text x="240" y="893" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:19px;font-weight:400" fill="#111">관상동맥질환+류마티스 374명</text>
<text x="240" y="930" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">500 mg, 12주, 위약 대조 (Hang 외, 2018)</text>
<rect x="480" y="805" width="400" height="150" rx="14" fill="#ffffff" stroke="#555" stroke-width="2.5"/>
<text x="680" y="850" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:24px;font-weight:700" fill="#111">뇌공등 추출물</text>
<text x="680" y="893" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:19px;font-weight:400" fill="#111">당뇨병성 신증 65명, 6개월</text>
<text x="680" y="930" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">발사르탄과 비교 (Ge 외, 2013)</text>
