<text x="1120" y="850" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:24px;font-weight:700" fill="#111">강황+보스웰릭산 혼합</text>
<text x="1120" y="893" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:19px;font-weight:400" fill="#111">골관절염 201명, 12주</text>
<text x="1120" y="930" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">혼합 제제라 단독 효과 분리 불가 (Haroyan 외, 2018)</text>
<rect x="1360" y="805" width="400" height="150" rx="14" fill="#ffffff" stroke="#555" stroke-width="2.5"/>
<text x="1560" y="850" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:24px;font-weight:700" fill="#111">트립톨라이드 독성</text>
<text x="1560" y="893" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:19px;font-weight:400" fill="#111">동물·세포: 간독성 보고 다수</text>
<text x="1560" y="930" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:15px;font-weight:400" fill="#111">LPS·TNF-α 감수성 (Yuan 외, 2020)</text>
<rect x="60" y="985" width="1680" height="90" rx="14" fill="#ffffff" stroke="#555" stroke-width="2.5"/>
<text x="900" y="1027" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:22px;font-weight:700" fill="#111">NF-κB를 누르는 성분은 염증을 줄이지만, 같은 경로가 세포의 생존 신호이기도 하다</text>
<text x="900" y="1060" text-anchor="middle" style="font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:18px;font-weight:400" fill="#111">트립톨라이드는 NF-κB 의존 생존 신호(FLIP)를 낮춰 간을 TNF-α에 민감하게 만들었다 (동물, Yuan 외, 2020)</text>
